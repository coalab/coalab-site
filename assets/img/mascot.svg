<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#eafaf1"/>
      <stop offset="100%" stop-color="#cdeede"/>
    </radialGradient>
    <radialGradient id="earGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#6e6f74"/>
      <stop offset="100%" stop-color="#3d3e42"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="38%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#9a9ba0"/>
      <stop offset="60%" stop-color="#7b7c81"/>
      <stop offset="100%" stop-color="#5a5b60"/>
    </radialGradient>
    <radialGradient id="muzzleGrad" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7e7e9"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b8c91"/>
      <stop offset="100%" stop-color="#68696e"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa374"/>
      <stop offset="100%" stop-color="#1f5f45"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123c2e"/>
      <stop offset="100%" stop-color="#0a2419"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a4d3a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="320" height="320" rx="28" fill="url(#bg)"/>

  <!-- ground shadow -->
  <ellipse cx="160" cy="280" rx="95" ry="12" fill="#1a4d3a" opacity="0.10"/>

  <!-- desk -->
  <rect x="45" y="238" width="230" height="16" rx="8" fill="url(#deskGrad)"/>
  <rect x="45" y="252" width="230" height="8" rx="4" fill="#164632"/>

  <!-- laptop -->
  <g filter="url(#soft)">
    <rect x="175" y="168" width="86" height="62" rx="8" fill="url(#screenGrad)"/>
    <rect x="183" y="176" width="70" height="46" rx="4" fill="#0f2b21"/>
    <polyline points="190,208 205,192 216,202 230,180 244,196" fill="none" stroke="#5be3a3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="230" cy="180" r="3" fill="#5be3a3"/>
    <rect x="171" y="228" width="94" height="8" rx="4" fill="#1a4d3a"/>
  </g>

  <!-- koala body (chibi, sitting) -->
  <g filter="url(#soft)">
    <ellipse cx="150" cy="215" rx="70" ry="58" fill="url(#bodyGrad)"/>
    <!-- belly -->
    <ellipse cx="150" cy="228" rx="46" ry="36" fill="#f2f2f0"/>
    <!-- arms -->
    <ellipse cx="92" cy="205" rx="16" ry="24" fill="#7b7c81" transform="rotate(-18 92 205)"/>
    <ellipse cx="205" cy="200" rx="15" ry="23" fill="#7b7c81" transform="rotate(24 205 200)"/>
    <!-- paws -->
    <circle cx="80" cy="228" r="11" fill="#9a9ba0"/>
    <circle cx="216" cy="222" r="10" fill="#9a9ba0"/>
  </g>

  <!-- head -->
  <g filter="url(#soft)">
    <!-- ears -->
    <circle cx="82" cy="98" r="34" fill="url(#earGrad)"/>
    <circle cx="218" cy="98" r="34" fill="url(#earGrad)"/>
    <circle cx="82" cy="98" r="18" fill="#8f9095"/>
    <circle cx="218" cy="98" r="18" fill="#8f9095"/>

    <!-- headphone band -->
    <path d="M78 92 Q150 20 222 92" fill="none" stroke="#2d8659" stroke-width="9" stroke-linecap="round"/>
    <!-- headphone cups -->
    <ellipse cx="78" cy="98" rx="14" ry="17" fill="#2d8659" stroke="#123c2e" stroke-width="2"/>
    <ellipse cx="222" cy="98" rx="14" ry="17" fill="#2d8659" stroke="#123c2e" stroke-width="2"/>
    <ellipse cx="78" cy="98" rx="6" ry="9" fill="#8dd4b8"/>
    <ellipse cx="222" cy="98" rx="6" ry="9" fill="#8dd4b8"/>
    <!-- mic -->
    <path d="M222 112 Q214 138 190 140" fill="none" stroke="#2d8659" stroke-width="5" stroke-linecap="round"/>
    <circle cx="190" cy="140" r="6" fill="#2d8659"/>

    <!-- head shape -->
    <circle cx="150" cy="130" r="70" fill="url(#headGrad)"/>

    <!-- muzzle / face patch -->
    <ellipse cx="150" cy="150" rx="46" ry="38" fill="url(#muzzleGrad)"/>

    <!-- eyes -->
    <circle cx="130" cy="140" r="9" fill="#1f2023"/>
    <circle cx="170" cy="140" r="9" fill="#1f2023"/>
    <circle cx="133" cy="136" r="3" fill="#ffffff"/>
    <circle cx="173" cy="136" r="3" fill="#ffffff"/>

    <!-- blush -->
    <ellipse cx="115" cy="158" rx="9" ry="6" fill="#f5a9a0" opacity="0.7"/>
    <ellipse cx="185" cy="158" rx="9" ry="6" fill="#f5a9a0" opacity="0.7"/>

    <!-- nose -->
    <ellipse cx="150" cy="152" rx="12" ry="9" fill="#26272a"/>
    <ellipse cx="146" cy="149" rx="3" ry="2" fill="#5a5b5e"/>

    <!-- mouth -->
    <path d="M150 161 Q150 170 138 172" fill="none" stroke="#26272a" stroke-width="3" stroke-linecap="round"/>
    <path d="M150 161 Q150 170 162 172" fill="none" stroke="#26272a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- sparkle accents -->
  <path d="M258 132 l5 12 12 5 -12 5 -5 12 -5-12 -12-5 12-5z" fill="#2d8659" opacity="0.85"/>
  <circle cx="52" cy="150" r="4" fill="#2d8659" opacity="0.6"/>
  <circle cx="270" cy="80" r="3" fill="#2d8659" opacity="0.5"/>

  <!-- wordmark -->
  <text x="160" y="300" font-family="Pretendard, sans-serif" font-size="17" font-weight="800" fill="#1a4d3a" text-anchor="middle">ai-news.coalab.co.kr</text>
</svg>
