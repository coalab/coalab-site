<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>교육실적 | COALAB</title>
    <meta name="description" content="COALAB 이수현 대표 교육실적 - 학교, 기업, 대학, 공공기관 대상 AI·코딩·데이터 교육 이력.">
    <meta name="theme-color" content="#FBF9F5">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css?v=20260815b" />
    <style>
        .records-wrap{max-width:900px;margin:0 auto;padding:60px 24px 80px}
        .records-wrap h2{font-size:26px;margin-bottom:6px}
        .records-wrap .sub{color:var(--ink-3);font-size:14px;margin-bottom:24px}
        .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
        .filters button{cursor:pointer;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);padding:8px 16px;border-radius:var(--radius-pill);font-size:13px;font-family:inherit}
        .filters button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
        .rtable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
        .rtable th{text-align:left;background:var(--bg-soft);color:var(--ink-3);font-size:12px;font-weight:700;padding:12px 14px}
        .rtable td{padding:12px 14px;font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line-soft)}
        .rtable td.org{color:var(--ink);font-weight:700;white-space:nowrap}
        .rtable td.when, .rtable td.cat{color:var(--ink-3);white-space:nowrap;font-size:12.5px}
        .rtable tr.hide{display:none}
        .rtable tbody tr:hover{background:var(--brand-tint)}
    </style>
</head>

<body>
    <header>
        <h1>
            <a href="index.html">
                <img src="./assets/img/logo.png?v=20260815b" alt="COALAB 로고" class="logo-img">
            </a>
        </h1>
        <nav>
            <a href="index.html">홈</a>
            <a href="index.html#services">교육 과정</a>
            <a href="records.html">교육실적</a>
            <a href="https://open.kakao.com/o/sZhJVf7" target="_blank" rel="noopener" class="nav-cta">강의 문의</a>
        </nav>
    </header>

    <div class="records-wrap">
        <h2>교육실적</h2>
        <p class="sub">학교·기업·대학·공공기관 대상 AI·코딩·데이터 교육 이력 (최신순)</p>

        <div class="filters" id="filters">
            <button class="active" data-filter="all">전체</button>
            <button data-filter="학교">학교(초중고)</button>
            <button data-filter="기업">기업</button>
            <button data-filter="대학">대학</button>
            <button data-filter="공공">공공·지자체</button>
            <button data-filter="코아랩">코아랩·파주</button>
        </div>

        <table class="rtable">
            <thead><tr><th>시기</th><th>기업·기관</th><th>과정명</th><th>분류</th></tr></thead>
            <tbody id="records-body"></tbody>
        </table>
    </div>

    <footer>
        <h4>COALAB</h4>
        <div class="social">
            <a href="https://ai-news.coalab.co.kr" target="_blank" rel="noopener">📰 AI뉴스</a>
            &nbsp;·&nbsp;
            <a href="https://blog.naver.com/valuablethings" target="_blank" rel="noopener">📝 블로그</a>
            &nbsp;·&nbsp;
            <a href="https://open.kakao.com/o/sZhJVf7" target="_blank" rel="noopener">💬 문의</a>
        </div>
        <p>© 2026 COALAB. All rights reserved.</p>
    </footer>

<script>
const records = [

];

const tbody = document.getElementById('records-body');
records.forEach(r => {
  const tr = document.createElement('tr');
  tr.dataset.cat = r[3];
  tr.innerHTML = `<td class="when">${r[0]}</td><td class="org">${r[1]}</td><td>${r[2]}</td><td class="cat">${r[3]}</td>`;
  tbody.appendChild(tr);
});

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const f = btn.dataset.filter;
  document.querySelectorAll('#records-body tr').forEach(tr => {
    tr.classList.toggle('hide', f !== 'all' && tr.dataset.cat !== f);
  });
});
</script>
</body>
</html>
