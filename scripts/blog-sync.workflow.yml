name: 블로그 새 글 동기화
on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 가능
permissions:
  contents: write
concurrency:
  group: blog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-blog.mjs
      - name: 변경이 있으면 커밋
        run: |
          git config user.name "coalab-bot"
          git config user.email "coalab-bot@users.noreply.github.com"
          git add assets/data/blog.json assets/img/blog/auto
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "chore: 블로그 새 글 자동 동기화" && git push; fi
